name: Beta

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (default: current)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build arm64
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project WinMio.xcodeproj \
            -scheme WinMio \
            -configuration Release \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=build/Release-arm64 \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="-"

      - name: Install create-dmg
        shell: bash
        run: brew install create-dmg

      - name: Build DMG
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/Release-arm64/WinMio.app"
          VERSION="${GITHUB_SHA::7}"
          DMG_NAME="WinMio-beta-${VERSION}-macOS-arm64.dmg"

          # Stage only the app so create-dmg's source folder stays clean.
          STAGE_DIR="dmg-stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          cp -R "$APP_PATH" "$STAGE_DIR/"

          create-dmg \
            --volname "WinMio" \
            --background "assets/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --text-size 13 \
            --icon "WinMio.app" 170 200 \
            --hide-extension "WinMio.app" \
            --app-drop-link 430 200 \
            --no-internet-enable \
            "$DMG_NAME" \
            "$STAGE_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinMio-beta-arm64
          path: WinMio-beta-*-macOS-arm64.dmg
          if-no-files-found: error
